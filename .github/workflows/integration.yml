name: Backend integration

# Exécution manuelle uniquement : ces vérifications touchent une vraie base
# Supabase/Postgres et créent puis suppriment des données de test.
on:
  workflow_dispatch:

jobs:
  verify:
    name: verify-backend + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      ALLOW_INSECURE_SITE_URL: "true"
      SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
      DEFAULT_STUDENT_PASSWORD: ${{ secrets.DEFAULT_STUDENT_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}

    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$DATABASE_URL" ] \
            && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] \
            && [ -n "$SUPERADMIN_PASSWORD" ] \
            && [ -n "$DEFAULT_STUDENT_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets DATABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPERADMIN_PASSWORD / DEFAULT_STUDENT_PASSWORD absents : job ignoré."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.secrets.outputs.configured == 'true'
        run: npx prisma generate

      - name: Apply migrations
        if: steps.secrets.outputs.configured == 'true'
        run: npx prisma migrate deploy

      - name: Verify backend services
        if: steps.secrets.outputs.configured == 'true'
        run: npm run verify:backend

      - name: Verify RLS policies
        if: steps.secrets.outputs.configured == 'true'
        run: node scripts/verify-rls.mjs

      - name: Build
        if: steps.secrets.outputs.configured == 'true'
        run: npm run build

      - name: Start Next
        if: steps.secrets.outputs.configured == 'true'
        run: |
          nohup npm start > /tmp/next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next.log
          exit 1

      - name: Smoke API
        if: steps.secrets.outputs.configured == 'true'
        run: node scripts/backend-smoke.mjs
